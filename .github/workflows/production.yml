name: FBMA Sales Management CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fbma-sales-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: 8.0.x

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        if: github.event_name != 'pull_request'
        run: dotnet publish --configuration Release --no-build --output publish

      - name: Upload deployment artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fbma-sales-management
          path: publish
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy sales management
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: fbma-sales-production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_SALES_WEBAPP_NAME }}
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: fbma-sales-management
          path: publish

      - name: Validate dedicated sales App Service
        shell: bash
        run: |
          if [[ -z "$AZURE_WEBAPP_NAME" ]]; then
            echo "Set the repository variable AZURE_SALES_WEBAPP_NAME to the dedicated sales App Service name." >&2
            exit 1
          fi
          if [[ "$AZURE_WEBAPP_NAME" == "app-web-01" || "$AZURE_WEBAPP_NAME" == "app-web-02" || "$AZURE_WEBAPP_NAME" == "app-03" ]]; then
            echo "Refusing to deploy the sales system over an existing website, CMS, or bowling service." >&2
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Check production health
        env:
          APP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$APP_URL/health"
