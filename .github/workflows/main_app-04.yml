name: FBMA Sales Management - app-04

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fbma-sales-app-04-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: 8.0.x
  AZURE_WEBAPP_NAME: app-04

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        if: github.event_name != 'pull_request'
        run: dotnet publish --configuration Release --no-build --output publish

      - name: Upload deployment artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fbma-sales-management
          path: publish
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy app-04
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: fbma-sales-production
      url: https://app-04-dgddbueabmb7fzf9.northeurope-01.azurewebsites.net
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: fbma-sales-management
          path: publish

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4788D7A6F5A9468BBBE71EA957C6822E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E00230CE2B78409094A6EF8E7C1B7938 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A0675C23E3164442AE7DF353894FF6C2 }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: publish

      - name: Check production health
        run: >-
          curl --fail --silent --show-error
          --retry 12 --retry-delay 10 --retry-all-errors
          https://app-04-dgddbueabmb7fzf9.northeurope-01.azurewebsites.net/health
